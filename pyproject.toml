[build-system]
requires = ["setuptools>=77.0"]
build-backend = "setuptools.build_meta"

[project]
name = "toxic_comment_classifier"
version = "0.4.0"
description = "Pre-trained BiLSTM classifier that scores comments for six kinds of toxicity (toxic, severe_toxic, obscene, threat, insult, identity_hate). Works offline, one line to use."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE.txt"]
authors = [{ name = "Md Irfan Ali", email = "irfanali29@hotmail.com" }]
keywords = [
    "toxicity",
    "toxic-comments",
    "content-moderation",
    "hate-speech",
    "text-classification",
    "multi-label-classification",
    "nlp",
    "deep-learning",
    "lstm",
    "keras",
    "tensorflow",
    "jigsaw",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Text Processing :: Linguistic",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Typing :: Typed",
]
dependencies = [
    "numpy>=1.23",
    "tensorflow>=2.16",
    "keras>=3.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "ruff>=0.17.3",
    "build>=1.0.0",
    "twine>=5.0.0",
]

[project.scripts]
toxic-classifier = "toxic_classifier.cli:main"

[project.urls]
Homepage = "https://github.com/irfanalidv/toxic_comment_classifier"
Documentation = "https://github.com/irfanalidv/toxic_comment_classifier#readme"
Repository = "https://github.com/irfanalidv/toxic_comment_classifier"
Issues = "https://github.com/irfanalidv/toxic_comment_classifier/issues"
Changelog = "https://github.com/irfanalidv/toxic_comment_classifier/blob/main/CHANGELOG.md"

[tool.setuptools]
packages = ["toxic_classifier"]

[tool.setuptools.package-data]
toxic_classifier = ["py.typed", "model/*.h5", "model/*.json"]

[tool.ruff]
target-version = "py310"
line-length = 100
extend-exclude = ["*.md"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]

[tool.ruff.lint.isort]
known-first-party = ["toxic_classifier"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra -q"
